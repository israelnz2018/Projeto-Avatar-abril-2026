<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<title>Ishikawa — LBW Copilot</title>

<style>
  /* ============================================================
     LBW Continuous Improvement Copilot — Ishikawa slide template
     A4 landscape, 1123 × 794 px, render alvo via html-to-image.
     Placeholders literais {{nome_do_campo}} preservados.
     ============================================================ */

  :root {
    --navy: #1E3A5F;
    --navy-soft: #2C4A70;
    --coral: #D85A30;
    --ink: #2A2F3A;
    --ink-soft: #3A3A3A;
    --muted: #6B7280;
    --hairline: #D1D5DB;
    --hairline-soft: #E5E7EB;
    --canvas: #FFFFFF;
    --panel: #F4F4F2;
    --chip-bg: #EAF1F8;
    --chip-border: #C7D6E6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #E8E8E6;
  }

  body {
    font-family: system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
  }

  .slide {
    width: 1123px;
    height: 794px;
    background: var(--canvas);
    position: relative;
    overflow: hidden;
    /* Outline simulando borda da página apenas em preview;
       html-to-image captura sem essa borda visual extra. */
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }

  /* ---------- Zona 1 — Cabeçalho ---------- */
  .header {
    height: 110px;
    padding: 24px 40px 0 40px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 24px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-left img.logo {
    width: 100px;
    height: 40px;
    object-fit: contain;
    display: block;
  }

  .header-right {
    text-align: right;
  }

  .title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--navy);
    line-height: 1.15;
    margin: 0;
  }

  .subtitle {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.005em;
  }

  .subtitle .sep {
    color: var(--hairline);
    margin: 0 8px;
  }

  .header-rule {
    position: absolute;
    left: 40px;
    right: 40px;
    top: 110px;
    height: 1px;
    background: var(--hairline-soft);
  }

  /* ---------- Zona 2 — Diagrama Ishikawa ---------- */
  .diagram {
    position: absolute;
    left: 0;
    top: 110px;
    width: 1123px;
    height: 460px;
  }

  .diagram svg {
    display: block;
    width: 1123px;
    height: 460px;
  }

  /* SVG text inherits family from page; explicit for safety */
  .diagram svg text {
    font-family: system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    fill: var(--ink-soft);
  }

  .cat-label {
    font-size: 12px;
    font-weight: 600;
    fill: var(--navy);
  }

  .cause-text {
    font-size: 11.5px;
    font-weight: 400;
    fill: var(--ink-soft);
  }

  .problem-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    fill: rgba(255,255,255,0.85);
  }

  .problem-text {
    font-size: 14px;
    font-weight: 600;
    fill: #FFFFFF;
  }

  /* HTML-rendered cause lists positioned over the SVG via foreignObject */
  .causes {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  .causes li {
    padding: 1px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .causes.right { text-align: left; }
  .causes.left  { text-align: right; }

  /* ---------- Zona 3 — Análise Executiva ---------- */
  .analysis {
    position: absolute;
    left: 40px;
    right: 40px;
    top: 580px;
    height: 184px;
    background: var(--panel);
    border-radius: 6px;
    padding: 18px 22px 16px 22px;
    border: 1px solid var(--hairline-soft);
  }

  .analysis-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: 0.02em;
    margin: 0 0 8px 0;
  }

  .analysis-body {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink);
    margin: 0;
    text-wrap: pretty;
  }

  .footer {
    position: absolute;
    left: 40px;
    right: 40px;
    bottom: 10px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>
<body>

  <div class="slide" role="img" aria-label="Diagrama de Ishikawa — LBW Copilot">

    <!-- ===== Zona 1 — Cabeçalho ===== -->
    <header class="header">
      <div class="header-left">
        <svg class="logo" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" aria-label="LBW"><rect width="240" height="80" rx="8" fill="#1E3A5F"/><text x="120" y="52" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="2">LBW</text></svg>
      </div>
      <div class="header-right">
        <h1 class="title">Análise de causa raiz — Diagrama de Ishikawa</h1>
        <div class="subtitle">
          Projeto: {{nome_projeto}}<span class="sep">·</span>Fase Analyze<span class="sep">·</span>{{data}}
        </div>
      </div>
    </header>
    <div class="header-rule"></div>

    <!-- ===== Zona 2 — Diagrama Ishikawa ===== -->
    <div class="diagram">
      <svg viewBox="0 0 1123 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Arrowhead da espinha central -->
          <marker id="spineArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"></path>
          </marker>
        </defs>

        <!-- ----- Espinha central horizontal ----- -->
        <!-- Espinha vai de x=70 até a borda esquerda do quadro do problema (x=905) -->
        <line x1="70" y1="230" x2="905" y2="230" stroke="#1E3A5F" stroke-width="1.75" stroke-linecap="round" marker-end="url(#spineArrow)"></line>

        <!-- ----- Quadro do problema (extremidade direita) ----- -->
        <g transform="translate(915, 188)">
          <rect x="0" y="0" width="180" height="84" rx="4" ry="4" fill="#D85A30"></rect>
          <text class="problem-title" x="90" y="22" text-anchor="middle">problema</text>
          <!-- Linha decorativa fina dentro do bloco -->
          <line x1="20" y1="30" x2="160" y2="30" stroke="rgba(255,255,255,0.35)" stroke-width="0.5"></line>
          <!-- Texto do problema com foreignObject para wrap -->
          <foreignObject x="12" y="34" width="156" height="46">
            <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
                        font-size: 13.5px; font-weight: 600; line-height: 1.25;
                        color: #FFFFFF; text-align: center; text-wrap: balance;">
              {{problema}}
            </div>
          </foreignObject>
        </g>

        <!-- ============================================================
             6 BONES DIAGONAIS
             Acima: Método (esq), Material (centro), Medida (dir)
             Abaixo: Máquina (esq), Mão de obra (centro), Meio ambiente (dir)
             Cada bone parte de (joinX, 230) e sobe/desce em diagonal até
             o quadro de categoria. Linhas finas horizontais saem do bone
             para hospedar as causas.
             ============================================================ -->

        <!-- ===== TOP-LEFT — Método =====
             Bone: (170,230) → (100,60). Lado externo = ACIMA do bone.
             Causas posicionadas à direita do bone, com y alto (próximo ao topo)
             para que nenhuma linha de texto cruze a diagonal. -->
        <g>
          <line x1="170" y1="230" x2="100" y2="60" stroke="#1E3A5F" stroke-width="0.9" stroke-linecap="round"></line>
          <g transform="translate(40, 30)">
            <rect width="120" height="28" rx="3" ry="3" fill="#EAF1F8" stroke="#C7D6E6" stroke-width="0.75"></rect>
            <text class="cat-label" x="60" y="18" text-anchor="middle">Método</text>
          </g>
          <foreignObject x="170" y="68" width="180" height="100">
            <ul xmlns="http://www.w3.org/1999/xhtml" class="causes right">
              {{metodo_causas}}
            </ul>
          </foreignObject>
        </g>

        <!-- ===== TOP-CENTER — Material ===== -->
        <g>
          <line x1="430" y1="230" x2="360" y2="60" stroke="#1E3A5F" stroke-width="0.9" stroke-linecap="round"></line>
          <g transform="translate(300, 30)">
            <rect width="120" height="28" rx="3" ry="3" fill="#EAF1F8" stroke="#C7D6E6" stroke-width="0.75"></rect>
            <text class="cat-label" x="60" y="18" text-anchor="middle">Material</text>
          </g>
          <foreignObject x="430" y="68" width="180" height="100">
            <ul xmlns="http://www.w3.org/1999/xhtml" class="causes right">
              {{material_causas}}
            </ul>
          </foreignObject>
        </g>

        <!-- ===== TOP-RIGHT — Medida ===== -->
        <g>
          <line x1="690" y1="230" x2="620" y2="60" stroke="#1E3A5F" stroke-width="0.9" stroke-linecap="round"></line>
          <g transform="translate(560, 30)">
            <rect width="120" height="28" rx="3" ry="3" fill="#EAF1F8" stroke="#C7D6E6" stroke-width="0.75"></rect>
            <text class="cat-label" x="60" y="18" text-anchor="middle">Medida</text>
          </g>
          <foreignObject x="690" y="68" width="180" height="100">
            <ul xmlns="http://www.w3.org/1999/xhtml" class="causes right">
              {{medida_causas}}
            </ul>
          </foreignObject>
        </g>

        <!-- ===== BOTTOM-LEFT — Máquina =====
             Bone: (170,230) → (100,400). Lado externo = ABAIXO do bone.
             Causas à direita do bone, com y baixo. -->
        <g>
          <line x1="170" y1="230" x2="100" y2="400" stroke="#1E3A5F" stroke-width="0.9" stroke-linecap="round"></line>
          <g transform="translate(40, 405)">
            <rect width="120" height="28" rx="3" ry="3" fill="#EAF1F8" stroke="#C7D6E6" stroke-width="0.75"></rect>
            <text class="cat-label" x="60" y="18" text-anchor="middle">Máquina</text>
          </g>
          <foreignObject x="170" y="295" width="180" height="100">
            <ul xmlns="http://www.w3.org/1999/xhtml" class="causes right">
              {{maquina_causas}}
            </ul>
          </foreignObject>
        </g>

        <!-- ===== BOTTOM-CENTER — Mão de obra ===== -->
        <g>
          <line x1="430" y1="230" x2="360" y2="400" stroke="#1E3A5F" stroke-width="0.9" stroke-linecap="round"></line>
          <g transform="translate(300, 405)">
            <rect width="120" height="28" rx="3" ry="3" fill="#EAF1F8" stroke="#C7D6E6" stroke-width="0.75"></rect>
            <text class="cat-label" x="60" y="18" text-anchor="middle">Mão de obra</text>
          </g>
          <foreignObject x="430" y="295" width="180" height="100">
            <ul xmlns="http://www.w3.org/1999/xhtml" class="causes right">
              {{mao_obra_causas}}
            </ul>
          </foreignObject>
        </g>

        <!-- ===== BOTTOM-RIGHT — Meio ambiente ===== -->
        <g>
          <line x1="690" y1="230" x2="620" y2="400" stroke="#1E3A5F" stroke-width="0.9" stroke-linecap="round"></line>
          <g transform="translate(560, 405)">
            <rect width="120" height="28" rx="3" ry="3" fill="#EAF1F8" stroke="#C7D6E6" stroke-width="0.75"></rect>
            <text class="cat-label" x="60" y="18" text-anchor="middle">Meio ambiente</text>
          </g>
          <foreignObject x="690" y="295" width="180" height="100">
            <ul xmlns="http://www.w3.org/1999/xhtml" class="causes right">
              {{meio_ambiente_causas}}
            </ul>
          </foreignObject>
        </g>

      </svg>
    </div>

    <!-- ===== Zona 3 — Análise Executiva ===== -->
    <section class="analysis">
      <p class="analysis-label">Análise executiva</p>
      <p class="analysis-body">{{analise_executiva}}</p>
    </section>

    <div class="footer">
      <span>LBW · Continuous Improvement Copilot</span>
      <span>Fase Analyze · Ishikawa</span>
    </div>

  </div>



</body></html>
